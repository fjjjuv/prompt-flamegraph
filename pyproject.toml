[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-flamegraph"
version = "0.3.2"
description = "Lightweight, dependency-free prompt context flamegraph generator for LLMs"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Fjjjuv" }
]
keywords = ["llm", "prompt", "flamegraph", "token", "profiling", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]
rich = ["rich>=13.0.0"]
dev = ["pytest>=7.0", "build", "twine"]

[project.scripts]
prompt-flamegraph = "prompt_flamegraph.cli:main"

[project.urls]
Homepage = "https://github.com/fjjjuv/prompt-flamegraph"
Repository = "https://github.com/fjjjuv/prompt-flamegraph"
Documentation = "https://fjjjuv.github.io/prompt-flamegraph/index.html"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_flamegraph"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/LICENSE.GPL",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
